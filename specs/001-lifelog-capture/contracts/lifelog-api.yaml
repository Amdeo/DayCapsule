openapi: 3.0.3
info:
  title: LifeLog Sync API (Draft)
  version: 0.1.0
  description: >-
    预留的云端同步服务接口，支持 LifeLog 应用上传本地记录、媒体、搜索与备份。
servers:
  - url: https://api.lifelog.example.com/v1
    description: Production (未来规划)
  - url: https://staging.lifelog.example.com/v1
    description: Staging
security:
  - bearerAuth: []

paths:
  /entries:
    post:
      summary: 上传或更新单条记录
      operationId: upsertEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifeLogEntryPayload'
      responses:
        '200':
          description: 成功创建或更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
    get:
      summary: 拉取最近更新的记录
      operationId: listEntries
      parameters:
        - in: query
          name: updated_after
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: 记录列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LifeLogEntryPayload'
  /entries/{id}:
    delete:
      summary: 删除指定记录
      operationId: deleteEntry
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '204':
          description: 删除成功
  /entries/{id}/media:
    post:
      summary: 上传媒体文件（照片/音频）
      operationId: uploadMedia
      parameters:
        - $ref: '#/components/parameters/EntryId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [photo, audio]
                checksum:
                  type: string
                  description: sha256
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
  /search:
    post:
      summary: 语义搜索记录
      operationId: searchEntries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                filters:
                  type: object
                  properties:
                    tags:
                      type: array
                      items:
                        type: string
                    mood:
                      type: string
                    date_range:
                      type: object
                      properties:
                        from:
                          type: string
                          format: date
                        to:
                          type: string
                          format: date
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchHit'
  /backups/export:
    post:
      summary: 触发 PDF/Word 导出
      operationId: exportRecords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_ids, format]
              properties:
                entry_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                format:
                  type: string
                  enum: [pdf, docx]
      responses:
        '202':
          description: 已进入导出队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EntryId:
      in: path
      name: id
      schema:
        type: string
        format: uuid
      required: true
  schemas:
    LifeLogEntryPayload:
      type: object
      required:
        - id
        - created_at
        - text_content
        - sync_status
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        text_content:
          type: string
        mood:
          type: string
        weather:
          type: string
        location:
          type: object
          properties:
            lat:
              type: number
              format: float
            lng:
              type: number
              format: float
            name:
              type: string
        tags_manual:
          type: array
          items:
            type: string
        tags_ai:
          type: array
          items:
            type: string
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaAttachment'
        sync_status:
          type: string
          enum: [pending, synced, failed]
        reminder_enabled:
          type: boolean
    MediaAttachment:
      type: object
      required:
        - id
        - type
        - uri
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [photo, audio]
        uri:
          type: string
        duration_sec:
          type: integer
        thumbnail_uri:
          type: string
        checksum:
          type: string
    SyncResponse:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, queued, synced]
        message:
          type: string
    SearchHit:
      type: object
      properties:
        entry_id:
          type: string
          format: uuid
        snippet:
          type: string
        highlight_tags:
          type: array
          items:
            type: string
        score:
          type: number
          format: float
