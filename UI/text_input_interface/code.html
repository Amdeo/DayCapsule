<!DOCTYPE html>
<html class="light" lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>文字记忆</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&amp;family=Lora:wght@400;700&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#E8A07D", // Warm Coral
              "background-light": "#FAF8F5", // Off-white/Cream
              "background-dark": "#211F1D", // Deep brown-black for dark mode
              "text-light": "#4E4A47", // Soft dark grey/brown
              "text-dark": "#EAE8E5", // Light cream for dark mode text
              "icon-light": "#8D8A87", // Lighter grey/brown for icons
              "icon-dark": "#A8A5A2", // Lighter grey for dark mode icons
              "subtle-light": "#EDEAE6", // Subtle background for buttons/inputs
              "subtle-dark": "#3A3836", // Subtle background for dark mode,
            },
            fontFamily: {
              "display": ["Manrope", "Noto Sans SC", "sans-serif"],
              "serif": ["Lora", "Noto Sans SC", "serif"]
            },
            borderRadius: { "DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px" },
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden text-text-light dark:text-text-dark">
<div class="flex flex-col h-screen">
<header class="flex shrink-0 items-center justify-between p-4 bg-background-light dark:bg-background-dark">
<button class="flex size-12 items-center justify-center text-icon-light dark:text-icon-dark">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
</button>
<h1 class="text-xl font-bold">文字记忆</h1>
<div class="flex items-center gap-2">
<button class="flex size-12 cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-transparent text-icon-light dark:text-icon-dark">
<span class="material-symbols-outlined text-3xl">add_photo_alternate</span>
</button>
</div>
</header>
<main class="flex flex-1 flex-col overflow-y-auto px-4">
<div class="flex-grow">
<label class="flex flex-col h-full">
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden text-text-light dark:text-text-dark focus:outline-0 focus:ring-0 border-none bg-transparent focus:border-none p-2 font-serif text-lg leading-relaxed placeholder:text-icon-light dark:placeholder:text-icon-dark" placeholder="今天发生了一件有趣的事..."></textarea>
</label>
</div>
</main>
<footer class="flex flex-col shrink-0 gap-4 p-4 bg-background-light dark:bg-background-dark">
<div class="flex w-full items-center justify-between gap-2 overflow-x-auto rounded-lg bg-subtle-light dark:bg-subtle-dark p-2">
<div class="flex gap-1">
<button class="p-3 text-icon-light dark:text-icon-dark rounded-md hover:bg-primary/20">
<span class="material-symbols-outlined">format_bold</span>
</button>
<button class="p-3 text-icon-light dark:text-icon-dark rounded-md hover:bg-primary/20">
<span class="material-symbols-outlined">format_italic</span>
</button>
<button class="p-3 text-icon-light dark:text-icon-dark rounded-md hover:bg-primary/20">
<span class="material-symbols-outlined">format_underlined</span>
</button>
<button class="p-3 text-icon-light dark:text-icon-dark rounded-md hover:bg-primary/20">
<span class="material-symbols-outlined">format_align_center</span>
</button>
<button class="p-3 text-icon-light dark:text-icon-dark rounded-md hover:bg-primary/20">
<span class="material-symbols-outlined">format_list_bulleted</span>
</button>
<button class="p-3 text-icon-light dark:text-icon-dark rounded-md hover:bg-primary/20">
<span class="material-symbols-outlined">link</span>
</button>
</div>
</div>
<div class="flex flex-1 gap-3 flex-wrap justify-between">
<button class="flex flex-1 min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-5 bg-subtle-light dark:bg-subtle-dark text-text-light dark:text-text-dark text-base font-bold leading-normal tracking-[0.015em]">
<span class="truncate">取消</span>
</button>
<button class="flex flex-1 min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em]">
<span class="truncate">保存</span>
</button>
</div>
</footer>
</div>
</div>
</body></html>
