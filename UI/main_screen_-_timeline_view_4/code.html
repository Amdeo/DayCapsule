<script>
    document.addEventListener('alpine:init', () => {
        Alpine.directive('long-press', (el, { expression }, { evaluate, cleanup }) => {
            let timeout;
            let moveThreshold = 15;
            let startX, startY;
            let moved = false;
            let isPressing = false;
            const start = (e) => {
                isPressing = true;
                moved = false;
                const touch = e.touches ? e.touches[0] : e;
                startX = touch.clientX;
                startY = touch.clientY;
                timeout = setTimeout(() => {
                    if (isPressing && !moved) {
                        el.dispatchEvent(new CustomEvent('long-press', { bubbles: true, detail: { clientX: startX, clientY: startY } }));
                    }
                }, 200); 
            };
            const move = (e) => {
                if (!isPressing) return;
                const touch = e.touches ? e.touches[0] : e;
                const deltaX = Math.abs(touch.clientX - startX);
                const deltaY = Math.abs(touch.clientY - startY);
                if (!moved && (deltaX > moveThreshold || deltaY > moveThreshold)) {
                    moved = true;
                }
                el.dispatchEvent(new CustomEvent('long-press-move', { bubbles: true, detail: { clientX: touch.clientX, clientY: touch.clientY } }));
            };
            const end = (e) => {
                clearTimeout(timeout);
                if (isPressing) {
                   el.dispatchEvent(new CustomEvent('long-press-up', { bubbles: true }));
                }
                isPressing = false;
            };
            el.addEventListener('mousedown', start);
            el.addEventListener('touchstart', start, { passive: true });
            document.addEventListener('mousemove', move);
            document.addEventListener('touchmove', move, { passive: true });
            document.addEventListener('mouseup', end);
            document.addEventListener('touchend', end);
            cleanup(() => {
                clearTimeout(timeout);
                el.removeEventListener('mousedown', start);
                el.removeEventListener('touchstart', start);
                document.removeEventListener('mousemove', move);
                document.removeEventListener('touchmove', move);
                document.removeEventListener('mouseup', end);
                document.removeEventListener('touchend', end);
            });
        });
    });
</script>
