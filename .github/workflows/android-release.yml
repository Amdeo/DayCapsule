name: Android APK Artifact

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable verbose diagnostics"
        type: boolean
        default: false

jobs:
  build-android-release:
    name: Build Unsigned Android APK Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      ANDROID_PLATFORM: "36"
      BUILD_TOOLS_VERSION: "36.0.0"
      NDK_VERSION: "27.1.12297006"
      CMAKE_VERSION: "3.22.1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.CMAKE_VERSION }}
            ${{ env.ANDROID_HOME }}/platforms/android-${{ env.ANDROID_PLATFORM }}
            ${{ env.ANDROID_HOME }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}
            ${{ env.ANDROID_HOME }}/platform-tools
          key: android-sdk-${{ runner.os }}-x86_64-sdk${{ env.ANDROID_PLATFORM }}-bt${{ env.BUILD_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}

      - name: Install Android SDK packages
        run: |
          # sdkmanager exits before yes, which trips pipefail with SIGPIPE.
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_PLATFORM }}" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}"

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Run verify
        working-directory: app
        run: pnpm run verify

      - name: Generate Android project
        working-directory: app
        env:
          NODE_ENV: "production"
        run: pnpm exec expo prebuild --platform android --non-interactive --clean

      - name: Cache native C++ build (.cxx)
        uses: actions/cache@v4
        with:
          path: app/android/app/.cxx
          key: native-cxx-${{ runner.os }}-x86_64-ndk${{ env.NDK_VERSION }}-${{ hashFiles('app/android/app/build.gradle', 'app/package.json') }}
          restore-keys: |
            native-cxx-${{ runner.os }}-x86_64-ndk${{ env.NDK_VERSION }}-

      - name: Show runner resources
        if: ${{ inputs.debug }}
        run: |
          echo "=== Architecture ==="
          uname -m
          echo "=== CPU ==="
          nproc
          echo "=== Memory ==="
          free -h || true
          echo "=== Disk ==="
          df -h

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/build.gradle', 'app/android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Tune Gradle for CI
        working-directory: app/android
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/^org\.gradle\.parallel=.*/org.gradle.parallel=false/' gradle.properties
          WORKERS=1
          if grep -q '^org\.gradle\.workers\.max=' gradle.properties; then
            sed -i "s/^org\\.gradle\\.workers\\.max=.*/org.gradle.workers.max=$WORKERS/" gradle.properties
          else
            echo "org.gradle.workers.max=$WORKERS" >> gradle.properties
          fi
          if grep -q '^org\.gradle\.caching=' gradle.properties; then
            sed -i 's/^org\.gradle\.caching=.*/org.gradle.caching=true/' gradle.properties
          else
            echo 'org.gradle.caching=true' >> gradle.properties
          fi
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' gradle.properties
          if ! grep -q '^reactNativeArchitectures=' gradle.properties; then
            echo 'reactNativeArchitectures=arm64-v8a,armeabi-v7a' >> gradle.properties
          fi
          echo "=== Gradle properties ==="
          cat gradle.properties
          if [ "${{ inputs.debug }}" = "true" ]; then
            echo "=== cgroup memory before build ==="
            for f in \
              /sys/fs/cgroup/memory.max \
              /sys/fs/cgroup/memory.current \
              /sys/fs/cgroup/memory.events \
              /sys/fs/cgroup/memory.events.local \
              /sys/fs/cgroup/memory.swap.max \
              /sys/fs/cgroup/memory.swap.current; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                cat "$f"
              fi
            done
          fi

      - name: Build unsigned release APK
        working-directory: app/android
        env:
          NODE_ENV: "production"
          NODE_OPTIONS: "--max-old-space-size=1024"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: |
          set -o pipefail
          build_log="$PWD/gradle-assemble-release.log"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --warn assembleRelease 2>&1 | tee "$build_log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== Gradle build log path ==="
            echo "$build_log"
            echo "=== cgroup memory after build ==="
            for f in \
              /sys/fs/cgroup/memory.max \
              /sys/fs/cgroup/memory.current \
              /sys/fs/cgroup/memory.events \
              /sys/fs/cgroup/memory.events.local \
              /sys/fs/cgroup/memory.swap.max \
              /sys/fs/cgroup/memory.swap.current; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                cat "$f"
              fi
            done
            echo "=== Kernel messages ==="
            dmesg | tail -n 200 || true
            echo "=== CMake logs ==="
            find . -path '*/CMakeFiles/CMakeError.log' -type f -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            find . -path '*/CMakeFiles/CMakeOutput.log' -type f -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            find . -path '*/CMakeCache.txt' -type f -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            echo "=== External native build logs ==="
            find . -path '*/build/intermediates/cxx/*' -type f \( -name '*.log' -o -name '*.txt' \) -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            echo "=== Gradle daemon logs ==="
            find "$HOME/.gradle/daemon" -maxdepth 2 -name 'daemon-*.out.log' -type f -exec tail -n 200 {} \; || true
            exit $status
          fi

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-build-diagnostics-${{ github.run_number }}
          path: |
            app/android/**/CMakeFiles/CMakeError.log
            app/android/**/CMakeFiles/CMakeOutput.log
            app/android/**/build/intermediates/cxx/**/*.log
            app/android/**/build/intermediates/cxx/**/*.txt
            app/android/gradle-assemble-release.log
            !app/android/app/.cxx/**
          if-no-files-found: warn

      - name: Show APK output
        run: ls -lah app/android/app/build/outputs/apk/release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daycapsule-unsigned-release-apk-${{ github.run_number }}
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Notify Feishu
        if: always()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVER_EMAIL: ${{ secrets.FEISHU_RECEIVER_EMAIL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'workflow_dispatch' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          # Skip if no Feishu credentials configured
          if [ -n "${FEISHU_WEBHOOK_URL:-}" ]; then
            # Webhook bot mode
            status_emoji="✅"
            if [ "${JOB_STATUS}" != "success" ]; then
              status_emoji="❌"
            fi
            run_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
            text="${status_emoji} DayCapsule Android Build ${JOB_STATUS}\nRepo: ${REPOSITORY}\nBranch: ${REF_NAME}\nRun: #${RUN_NUMBER}\nSHA: ${SHA:0:7}\nActor: ${ACTOR}\nCommit: ${COMMIT_MESSAGE}\n${run_url}"
            payload="$(python3 -c 'import json, os; print(json.dumps({"msg_type": "text", "content": {"text": os.environ["text"]}}))')"
            curl --silent --show-error --fail-with-body \
              --request POST \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data "$payload" \
              "$FEISHU_WEBHOOK_URL"
            echo "Feishu webhook notification sent"
            exit 0
          fi

          if [ -z "${FEISHU_APP_ID:-}" ] || [ -z "${FEISHU_APP_SECRET:-}" ] || [ -z "${FEISHU_RECEIVER_EMAIL:-}" ]; then
            echo "Feishu secrets not fully configured (need FEISHU_APP_ID + FEISHU_APP_SECRET + FEISHU_RECEIVER_EMAIL, or FEISHU_WEBHOOK_URL), skipping notification"
            exit 0
          fi

          # Custom app mode (email receiver)
          token_response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "{\"app_id\":\"${FEISHU_APP_ID}\",\"app_secret\":\"${FEISHU_APP_SECRET}\"}" \
            https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal)"

          tenant_access_token="$(TOKEN_RESPONSE="$token_response" python3 -c 'import json, os, sys; data = json.loads(os.environ["TOKEN_RESPONSE"]); code = data.get("code"); 0 if code == 0 else (print(data, file=sys.stderr), (_ for _ in ()).throw(SystemExit("Failed to get Feishu tenant_access_token"))); print(data["tenant_access_token"])')"

          status_emoji="✅"
          if [ "${JOB_STATUS}" != "success" ]; then
            status_emoji="❌"
          fi
          run_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          text="${status_emoji} DayCapsule Android Build ${JOB_STATUS}\nRepo: ${REPOSITORY}\nBranch: ${REF_NAME}\nRun: #${RUN_NUMBER}\nSHA: ${SHA:0:7}\nActor: ${ACTOR}\nCommit: ${COMMIT_MESSAGE}\n${run_url}"

          message_payload="$(python3 -c 'import json, os; text = os.environ["text"]; email = os.environ["FEISHU_RECEIVER_EMAIL"]; print(json.dumps({"receive_id": email, "msg_type": "text", "content": json.dumps({"text": text}, ensure_ascii=False)}, ensure_ascii=False))')"

          send_response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${tenant_access_token}" \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$message_payload" \
            'https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=email')"

          SEND_RESPONSE="$send_response" python3 -c 'import json, os, sys; data = json.loads(os.environ["SEND_RESPONSE"]); code = data.get("code"); 0 if code == 0 else (print(data, file=sys.stderr), (_ for _ in ()).throw(SystemExit("Failed to send Feishu notification")))'
          echo "Feishu notification sent to ${FEISHU_RECEIVER_EMAIL}"
