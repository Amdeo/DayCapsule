name: Backend Image Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则使用 sha-<shortsha>）"
        required: false
        default: ""
        type: string

env:
  PACKAGE_REGISTRY: ${{ vars.PACKAGE_REGISTRY }}

jobs:
  build-backend-image:
    name: Build Backend Image And Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 运行后端测试
        working-directory: backend
        run: go test ./...

      - name: 运行部署制品脚本测试
        run: bash scripts/test-build-backend-deploy-bundle.sh

      - name: 计算镜像元数据
        id: meta
        env:
          PACKAGE_REGISTRY: ${{ vars.PACKAGE_REGISTRY }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "${PACKAGE_REGISTRY:-}" ]; then
            echo "PACKAGE_REGISTRY variable is required" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER}"
          short_sha="${GITHUB_SHA::7}"
          image_repo="${PACKAGE_REGISTRY}/${owner}/daycapsule-backend"

          if [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION}"
          else
            version="sha-${short_sha}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_repo=$image_repo" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_repo}:${version}" >> "$GITHUB_OUTPUT"
          echo "latest_ref=${image_repo}:latest" >> "$GITHUB_OUTPUT"

      - name: 登录 Gitea 包仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.PACKAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PKG_TOKEN }}

      - name: 构建并推送多架构镜像
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${{ steps.meta.outputs.image_ref }}" \
            -t "${{ steps.meta.outputs.latest_ref }}" \
            --push \
            backend

      - name: 校验镜像平台
        run: |
          inspect_output="$(docker buildx imagetools inspect "${{ steps.meta.outputs.image_ref }}")"
          printf '%s\n' "$inspect_output"

          printf '%s\n' "$inspect_output" | grep -F "linux/amd64" >/dev/null
          printf '%s\n' "$inspect_output" | grep -F "linux/arm64" >/dev/null

      - name: 生成部署目录
        id: bundle
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bundle_root="$RUNNER_TEMP/daycapsule-backend-deploy"
          release_dir="$bundle_root/daycapsule-backend-${RELEASE_VERSION}"
          mkdir -p "$bundle_root"

          bash scripts/build-backend-deploy-bundle.sh "$release_dir" "$IMAGE_REF" "$RELEASE_VERSION"

          test -f "$release_dir/docker-compose.shared-nginx.yml"
          test -f "$release_dir/deploy/backend/daycapsule.conf"
          test -f "$release_dir/deploy/backend/daycapsule.host-nginx.conf"
          JWT_SECRET=test-secret docker compose -f "$release_dir/docker-compose.yml" config >/dev/null
          JWT_SECRET=test-secret docker compose -f "$release_dir/docker-compose.shared-nginx.yml" config >/dev/null

          config_output="$(JWT_SECRET=test-secret docker compose -f "$release_dir/docker-compose.yml" config)"
          printf '%s\n' "$config_output" | grep -F "host_ip: 127.0.0.1" >/dev/null
          printf '%s\n' "$config_output" | grep -F 'published: "3000"' >/dev/null
          if printf '%s\n' "$config_output" | grep -F "nginx:" >/dev/null; then
            echo "unexpected nginx service in deploy bundle" >&2
            exit 1
          fi

          shared_config_output="$(JWT_SECRET=test-secret docker compose -f "$release_dir/docker-compose.shared-nginx.yml" config)"
          printf '%s\n' "$shared_config_output" | grep -F "shared-proxy:" >/dev/null
          if printf '%s\n' "$shared_config_output" | grep -F "nginx:" >/dev/null; then
            echo "unexpected nginx service in shared deploy bundle" >&2
            exit 1
          fi
          if printf '%s\n' "$shared_config_output" | grep -F "127.0.0.1:3000:3000" >/dev/null; then
            echo "unexpected host loopback port mapping in shared deploy bundle" >&2
            exit 1
          fi

          cd "$bundle_root"
          zip -r "daycapsule-backend-${RELEASE_VERSION}.zip" "daycapsule-backend-${RELEASE_VERSION}"
          echo "bundle_zip=$bundle_root/daycapsule-backend-${RELEASE_VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: 上传部署制品
        uses: actions/upload-artifact@v3
        with:
          name: daycapsule-backend-${{ steps.meta.outputs.version }}
          path: ${{ steps.bundle.outputs.bundle_zip }}
          if-no-files-found: error
