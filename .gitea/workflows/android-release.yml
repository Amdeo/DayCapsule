name: Android Release APK

on:
  workflow_dispatch:

jobs:
  build-android-release:
    name: Build Unsigned Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_ENV: "production"
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android SDK packages
        run: |
          # sdkmanager exits before yes, which trips pipefail with SIGPIPE.
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Run tests
        working-directory: app
        run: npm test -- --runInBand

      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Show runner resources
        run: |
          echo "=== Architecture ==="
          uname -m
          echo "=== CPU ==="
          nproc
          echo "=== Memory ==="
          free -h || true
          echo "=== Disk ==="
          df -h

      - name: Patch Android CMake on arm64 runners
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: $arch"
          if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then
            export DEBIAN_FRONTEND=noninteractive
            dpkg --add-architecture amd64

            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              mv /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.disabled
            fi

            printf '%s\n' \
              'Types: deb' \
              'URIs: https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports' \
              'Suites: noble noble-updates noble-backports noble-security' \
              'Components: main restricted universe multiverse' \
              'Architectures: arm64' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
              >/etc/apt/sources.list.d/ubuntu-arm64.sources

            printf '%s\n' \
              'Types: deb' \
              'URIs: https://mirrors.tuna.tsinghua.edu.cn/ubuntu' \
              'Suites: noble noble-updates noble-backports noble-security' \
              'Components: main restricted universe multiverse' \
              'Architectures: amd64' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
              >/etc/apt/sources.list.d/ubuntu-amd64.sources

            echo "=== Ubuntu sources ==="
            cat /etc/apt/sources.list.d/ubuntu.sources.disabled || true
            cat /etc/apt/sources.list.d/ubuntu-arm64.sources
            cat /etc/apt/sources.list.d/ubuntu-amd64.sources

            apt-get update
            apt-get install -y \
              cmake \
              ninja-build \
              libc6:amd64 \
              libstdc++6:amd64 \
              libgcc-s1:amd64 \
              zlib1g:amd64

            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
            sdk_cmake_bin="$sdk_root/cmake/3.22.1/bin"
            ndk_clang="$sdk_root/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

            mv "$sdk_cmake_bin/cmake" "$sdk_cmake_bin/cmake.sdk"
            ln -sf /usr/bin/cmake "$sdk_cmake_bin/cmake"
            mv "$sdk_cmake_bin/ninja" "$sdk_cmake_bin/ninja.sdk"
            ln -sf /usr/bin/ninja "$sdk_cmake_bin/ninja"

            echo "=== Patched SDK CMake binaries ==="
            "$sdk_cmake_bin/cmake" --version
            "$sdk_cmake_bin/ninja" --version
            echo "=== x86_64 loader ==="
            ls -l /lib64/ld-linux-x86-64.so.2 || true
            echo "=== NDK clang smoke test ==="
            file "$ndk_clang" || true
            "$ndk_clang" --version
          else
            echo "Skipping arm64 CMake patch"
          fi

      - name: Tune Gradle for CI
        working-directory: app/android
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/^org\.gradle\.parallel=.*/org.gradle.parallel=false/' gradle.properties
          grep -q '^org\.gradle\.workers\.max=' gradle.properties || echo 'org.gradle.workers.max=2' >> gradle.properties
          echo "=== Gradle properties ==="
          cat gradle.properties

      - name: Build unsigned release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --info assembleRelease || {
            status=$?
            echo "=== CMake logs ==="
            find . -path '*/CMakeFiles/CMakeError.log' -type f -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            find . -path '*/CMakeFiles/CMakeOutput.log' -type f -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            find . -path '*/CMakeCache.txt' -type f -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            echo "=== External native build logs ==="
            find . -path '*/build/intermediates/cxx/*' -type f \( -name '*.log' -o -name '*.txt' \) -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            echo "=== Gradle daemon logs ==="
            find "$HOME/.gradle/daemon" -maxdepth 2 -name 'daemon-*.out.log' -type f -exec tail -n 200 {} \; || true
            exit $status
          }

      - name: Show APK output
        run: ls -lah app/android/app/build/outputs/apk/release

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
