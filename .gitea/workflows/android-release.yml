name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable verbose diagnostics"
        type: boolean
        default: false

jobs:
  build-android-release:
    name: Build Unsigned Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      ANDROID_PLATFORM: "36"
      BUILD_TOOLS_VERSION: "36.0.0"
      NDK_VERSION: "27.1.12297006"
      CMAKE_VERSION: "3.22.1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: 检测运行器架构
        id: arch
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: 缓存 Android SDK
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.CMAKE_VERSION }}
            ${{ env.ANDROID_HOME }}/platforms/android-${{ env.ANDROID_PLATFORM }}
            ${{ env.ANDROID_HOME }}/build-tools/${{ env.BUILD_TOOLS_VERSION }}
            ${{ env.ANDROID_HOME }}/platform-tools
          key: android-sdk-${{ runner.os }}-${{ steps.arch.outputs.arch }}-sdk${{ env.ANDROID_PLATFORM }}-bt${{ env.BUILD_TOOLS_VERSION }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}

      - name: 安装 Android SDK 组件
        run: |
          # sdkmanager exits before yes, which trips pipefail with SIGPIPE.
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_PLATFORM }}" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}"

      - name: 安装依赖
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        working-directory: app
        run: pnpm run typecheck

      - name: 运行测试
        working-directory: app
        run: pnpm test --runInBand

      - name: 生成 Android 工程
        working-directory: app
        env:
          NODE_ENV: "production"
        run: pnpm exec expo prebuild --platform android --non-interactive --clean

      - name: 缓存原生 C++ 构建产物（.cxx）
        uses: actions/cache@v3
        with:
          path: app/android/app/.cxx
          key: native-cxx-${{ runner.os }}-${{ steps.arch.outputs.arch }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('app/android/app/build.gradle', 'app/package.json') }}
          restore-keys: |
            native-cxx-${{ runner.os }}-${{ steps.arch.outputs.arch }}-ndk${{ env.NDK_VERSION }}-

      - name: 显示运行器资源
        if: ${{ inputs.debug }}
        run: |
          echo "=== Architecture ==="
          uname -m
          echo "=== CPU ==="
          nproc
          echo "=== Memory ==="
          free -h || true
          echo "=== Disk ==="
          df -h

      - name: 配置多架构 APT 源（arm64）
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: $arch"
          if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then
            export DEBIAN_FRONTEND=noninteractive
            dpkg --add-architecture amd64

            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              mv /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.disabled
            fi

            printf '%s\n' \
              'Types: deb' \
              'URIs: https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports' \
              'Suites: noble noble-updates noble-backports noble-security' \
              'Components: main restricted universe multiverse' \
              'Architectures: arm64' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
              >/etc/apt/sources.list.d/ubuntu-arm64.sources

            printf '%s\n' \
              'Types: deb' \
              'URIs: https://mirrors.tuna.tsinghua.edu.cn/ubuntu' \
              'Suites: noble noble-updates noble-backports noble-security' \
              'Components: main restricted universe multiverse' \
              'Architectures: amd64' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
              >/etc/apt/sources.list.d/ubuntu-amd64.sources

            echo "=== Ubuntu sources ==="
            cat /etc/apt/sources.list.d/ubuntu.sources.disabled || true
            cat /etc/apt/sources.list.d/ubuntu-arm64.sources
            cat /etc/apt/sources.list.d/ubuntu-amd64.sources
          else
            echo "Skipping arm64 apt source configuration"
          fi

      - name: 安装 x86_64 依赖（arm64）
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: $arch"
          if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y \
              cmake \
              ninja-build \
              libc6:amd64 \
              libstdc++6:amd64 \
              libgcc-s1:amd64 \
              zlib1g:amd64
          else
            echo "Skipping arm64 x86_64 dependency installation"
          fi

      - name: 修补 SDK 的 CMake 和 Ninja（arm64）
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: $arch"
          if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
            sdk_cmake_bin="$sdk_root/cmake/$CMAKE_VERSION/bin"
            ninja_wrapper="/usr/local/bin/ninja-ci"

            mv "$sdk_cmake_bin/cmake" "$sdk_cmake_bin/cmake.sdk"
            ln -sf /usr/bin/cmake "$sdk_cmake_bin/cmake"
            printf '%s\n' \
              '#!/bin/sh' \
              'exec /usr/bin/ninja -j2 "$@"' \
              >"$ninja_wrapper"
            chmod +x "$ninja_wrapper"
            mv "$sdk_cmake_bin/ninja" "$sdk_cmake_bin/ninja.sdk"
            ln -sf "$ninja_wrapper" "$sdk_cmake_bin/ninja"

            echo "=== Patched SDK CMake binaries ==="
            "$sdk_cmake_bin/cmake" --version
            "$sdk_cmake_bin/ninja" --version
            echo "=== Ninja wrapper ==="
            cat "$ninja_wrapper"
          else
            echo "Skipping arm64 CMake patch"
          fi

      - name: NDK 冒烟测试（arm64）
        if: ${{ inputs.debug }}
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: $arch"
          if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
            ndk_toolchain_bin="$sdk_root/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
            ndk_clang="$ndk_toolchain_bin/clang"
            ndk_clangxx="$ndk_toolchain_bin/clang++"
            ndk_llvm_ar="$ndk_toolchain_bin/llvm-ar"
            ndk_lld="$ndk_toolchain_bin/ld.lld"

            echo "=== x86_64 loader ==="
            ls -l /lib64/ld-linux-x86-64.so.2 || true
            echo "=== NDK host tools ==="
            file "$ndk_clang" "$ndk_clangxx" "$ndk_llvm_ar" "$ndk_lld" || true
            "$ndk_clang" --version
            "$ndk_clangxx" --version
            "$ndk_llvm_ar" --version
            "$ndk_lld" --version
            echo "=== NDK C compile/link smoke test ==="
            tmpdir="$(mktemp -d)"
            printf '%s\n' 'int add(int a, int b) { return a + b; }' >"$tmpdir/test.c"
            "$ndk_clang" \
              --target=aarch64-linux-android24 \
              -shared \
              -fPIC \
              "$tmpdir/test.c" \
              -o "$tmpdir/libtest-c.so"
            ls -lah "$tmpdir/libtest-c.so"
            echo "=== NDK C++ compile/link smoke test ==="
            printf '%s\n' \
              '#include <string>' \
              'extern "C" int answer() {' \
              '  std::string value = "42";' \
              '  return value == "42" ? 42 : 0;' \
              '}' >"$tmpdir/test.cpp"
            "$ndk_clangxx" \
              --target=aarch64-linux-android24 \
              -shared \
              -fPIC \
              -std=c++20 \
              "$tmpdir/test.cpp" \
              -o "$tmpdir/libtest-cpp.so"
            ls -lah "$tmpdir/libtest-cpp.so"
          else
            echo "Skipping arm64 NDK smoke test"
          fi

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/build.gradle', 'app/android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 配置 Gradle 镜像源（中国）
        run: |
          mkdir -p ~/.gradle/init.d/
          cat > ~/.gradle/init.d/mirrors.init.gradle <<'EOF'
          def aliyunMirrors = [
              'https://maven.aliyun.com/repository/public',   // Maven Central, JCenter
              'https://maven.aliyun.com/repository/google',   // Google Maven
              'https://maven.aliyun.com/repository/gradle-plugin', // Gradle Plugin Portal
          ]

          def prependMirrors = { repositories ->
              def existing = repositories.collect()
              repositories.clear()
              aliyunMirrors.each { url -> repositories.maven { it.url = uri(url) } }
              existing.each { repositories.add(it) }
          }

          gradle.projectsLoaded {
              rootProject.allprojects { project ->
                  prependMirrors(project.buildscript.repositories)
              }
          }

          gradle.projectsEvaluated {
              rootProject.allprojects { project ->
                  prependMirrors(project.repositories)
              }
          }

          settingsEvaluated { settings ->
              prependMirrors(settings.pluginManagement.repositories)
          }
          EOF
          echo "=== ~/.gradle/init.d/mirrors.init.gradle ==="
          cat ~/.gradle/init.d/mirrors.init.gradle

      - name: 调整 Gradle 以适配 CI
        working-directory: app/android
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/^org\.gradle\.parallel=.*/org.gradle.parallel=false/' gradle.properties
          WORKERS=1
          if grep -q '^org\.gradle\.workers\.max=' gradle.properties; then
            sed -i "s/^org\\.gradle\\.workers\\.max=.*/org.gradle.workers.max=$WORKERS/" gradle.properties
          else
            echo "org.gradle.workers.max=$WORKERS" >> gradle.properties
          fi
          if grep -q '^org\.gradle\.caching=' gradle.properties; then
            sed -i 's/^org\.gradle\.caching=.*/org.gradle.caching=true/' gradle.properties
          else
            echo 'org.gradle.caching=true' >> gradle.properties
          fi
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' gradle.properties
          if ! grep -q '^reactNativeArchitectures=' gradle.properties; then
            echo 'reactNativeArchitectures=arm64-v8a,armeabi-v7a' >> gradle.properties
          fi
          arch="$(uname -m)"
          if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then
            # React Native's getHermesOSBin() doesn't recognize aarch64 Linux;
            # force linux64-bin hermesc which runs via binfmt on arm64 runners
            sed -i 's|%OS-BIN%|linux64-bin|' app/build.gradle
          fi
          echo "=== Gradle properties ==="
          cat gradle.properties
          if [ "${{ inputs.debug }}" = "true" ]; then
            echo "=== cgroup memory before build ==="
            for f in \
              /sys/fs/cgroup/memory.max \
              /sys/fs/cgroup/memory.current \
              /sys/fs/cgroup/memory.events \
              /sys/fs/cgroup/memory.events.local \
              /sys/fs/cgroup/memory.swap.max \
              /sys/fs/cgroup/memory.swap.current; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                cat "$f"
              fi
            done
          fi

      - name: 构建未签名的 Release APK
        working-directory: app/android
        env:
          NODE_ENV: "production"
          NODE_OPTIONS: "--max-old-space-size=1024"
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: |
          set -o pipefail
          build_log="$PWD/gradle-assemble-release.log"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --warn assembleRelease 2>&1 | tee "$build_log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== Gradle build log path ==="
            echo "$build_log"
            echo "=== cgroup memory after build ==="
            for f in \
              /sys/fs/cgroup/memory.max \
              /sys/fs/cgroup/memory.current \
              /sys/fs/cgroup/memory.events \
              /sys/fs/cgroup/memory.events.local \
              /sys/fs/cgroup/memory.swap.max \
              /sys/fs/cgroup/memory.swap.current; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                cat "$f"
              fi
            done
            echo "=== Kernel messages ==="
            dmesg | tail -n 200 || true
            echo "=== CMake logs ==="
            find . -path '*/CMakeFiles/CMakeError.log' -type f -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            find . -path '*/CMakeFiles/CMakeOutput.log' -type f -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            find . -path '*/CMakeCache.txt' -type f -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            echo "=== External native build logs ==="
            find . -path '*/build/intermediates/cxx/*' -type f \( -name '*.log' -o -name '*.txt' \) -exec sh -c 'echo "--- $1 ---"; tail -n 200 "$1"' _ {} \; || true
            echo "=== Gradle daemon logs ==="
            find "$HOME/.gradle/daemon" -maxdepth 2 -name 'daemon-*.out.log' -type f -exec tail -n 200 {} \; || true
            exit $status
          fi

      - name: 上传构建诊断信息
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: android-native-build-diagnostics-${{ github.run_number }}
          path: |
            app/android/**/CMakeFiles/CMakeError.log
            app/android/**/CMakeFiles/CMakeOutput.log
            app/android/**/build/intermediates/cxx/**/*.log
            app/android/**/build/intermediates/cxx/**/*.txt
            app/android/gradle-assemble-release.log
            !app/android/app/.cxx/**
          if-no-files-found: warn

      - name: 显示 APK 输出
        run: ls -lah app/android/app/build/outputs/apk/release

      - name: 发布 APK 到 Gitea 软件包仓库
        run: |
          APK=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION=$(date +%Y%m%d)-${{ github.run_number }}
          curl --fail \
            --user "${{ vars.PKG_USERNAME }}:${{ secrets.PKG_TOKEN }}" \
            --upload-file "$APK" \
            "https://gitea.yuandongbin.asia:8443/api/packages/cooper/generic/daycapsule-apk/${VERSION}/app-release.apk"
