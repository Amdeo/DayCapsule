name: Android Release APK

on:
  workflow_dispatch:

jobs:
  build-android-release:
    name: Build Unsigned Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Run tests
        working-directory: app
        run: npm test -- --runInBand

      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build unsigned release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Show APK output
        run: ls -lah app/android/app/build/outputs/apk/release

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
