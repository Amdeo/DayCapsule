<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Capsule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.0.0/dist/flowbite.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme_memory_1.css">
    <style>
        .timeline-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease;
        }
        .timeline-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .type-indicator {
            width: 4px;
            border-radius: 2px;
        }
        .waveform {
            background: repeating-linear-gradient(
                90deg,
                var(--muted) 0%,
                var(--muted) 20%,
                transparent 20%,
                transparent 40%
            );
            height: 40px;
        }
    </style>
</head>
<body class="bg-[var(--background)] font-sans p-4">
    <!-- 即时输入区 -->
    <div class="sticky top-0 z-10 bg-[var(--background)] pb-4">
        <div class="flex gap-2 mb-2">
            <button class="flex-1 p-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)]" 
                    data-input-type="text">
                📝 快速记录
            </button>
            <button class="p-2 rounded-lg bg-[var(--secondary)] text-[var(--secondary-foreground)]"
                    data-input-type="audio">
                🎤
            </button>
            <button class="p-2 rounded-lg bg-[var(--accent)] text-[var(--accent-foreground)]"
                    data-input-type="photo">
                📷
            </button>
        </div>

        <!-- 动态输入容器 -->
        <div id="inlineInput" class="hidden">
            <!-- 文字输入 -->
            <textarea class="w-full p-2 rounded-lg bg-[var(--card)]" 
                      data-type="text" 
                      placeholder="输入文字..."></textarea>

            <!-- 录音界面 -->
            <div data-type="audio" class="p-4 bg-[var(--muted)] rounded-lg">
                <div class="waveform-animation h-12 mb-2"></div>
                <div class="flex justify-between text-sm">
                    <span>00:00</span>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 bg-[var(--destructive)] rounded">取消</button>
                        <button class="px-3 py-1 bg-[var(--primary)] rounded">保存</button>
                    </div>
                </div>
            </div>

            <!-- 拍照界面 -->
            <div data-type="photo" class="relative">
                <div class="camera-preview aspect-video bg-[var(--muted)]"></div>
                <button class="absolute bottom-4 left-1/2 transform -translate-x-1/2 w-12 h-12 bg-red-500 rounded-full border-4 border-white"></button>
            </div>
        </div>
    </div>
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-[var(--foreground)]">记忆胶囊</h1>
        <div class="flex gap-2">
            <button class="p-2 rounded-full hover:bg-[var(--muted)]">
                <svg class="w-6 h-6 text-[var(--foreground)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h9m5-4v12m0 0l-4-4m4 4l4-4"/>
                </svg>
            </button>
            <button class="p-2 rounded-full hover:bg-[var(--muted)]">
                <svg class="w-6 h-6 text-[var(--foreground)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Timeline -->
    <div class="relative pl-8">
        <!-- Timeline Line -->
        <div class="absolute left-4 w-0.5 h-full bg-[var(--border)]"></div>

        <!-- Today Section -->
        <div class="relative mb-8">
            <div class="absolute left-[-17px] top-2 w-3 h-3 rounded-full bg-[var(--primary)]"></div>
            <h3 class="text-lg font-semibold text-[var(--foreground)] mb-4">今天</h3>

            <!-- Photo Card -->
            <div class="timeline-card p-4 mb-4">
                <div class="flex gap-4">
                    <div class="type-indicator bg-[var(--chart-1)]"></div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2 text-sm text-[var(--muted-foreground)] mb-2">
                            <span>🕒 14:30</span>
                            <span>📷</span>
                        </div>
                        <img src="https://placehold.co/600x400" alt="Memory" class="rounded-lg mb-2 w-full h-48 object-cover">
                        <p class="text-[var(--foreground)]">公园散步，阳光正好</p>
                        <div class="flex items-center gap-1 mt-2 text-sm text-[var(--muted-foreground)]">
                            <span>📍</span>
                            <span>中央公园</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Audio Card -->
            <div class="timeline-card p-4 mb-4">
                <div class="flex gap-4">
                    <div class="type-indicator bg-[var(--chart-2)]"></div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2 text-sm text-[var(--muted-foreground)] mb-2">
                            <span>🕒 12:15</span>
                            <span>🎤</span>
                        </div>
                        <div class="waveform rounded-lg mb-2"></div>
                        <p class="text-[var(--foreground)]">关于项目的新想法...</p>
                        <div class="flex items-center gap-2 mt-2">
                            <button class="p-2 hover:bg-[var(--muted)] rounded-full">
                                ▶️
                            </button>
                            <span class="text-sm text-[var(--muted-foreground)]">1:30</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FAB -->
    <button class="fixed bottom-8 right-8 w-14 h-14 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] flex items-center justify-center shadow-lg hover:scale-105 transition-transform">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
    </button>
    <!-- 导航菜单 -->
    <nav class="hidden" data-navigation>
        <a href="memory_capsule_1.html">时间线</a>
        <a href="memory_capsule_2.html">新建</a>
    </nav>
    <!-- 悬浮输入容器 -->
    <div class="fixed bottom-0 left-0 right-0 bg-[var(--popover)] p-4 shadow-2xl rounded-t-2xl transition-transform duration-300 translate-y-full" id="inputContainer">
        <div class="flex gap-2 mb-4" id="inputSelector">
            <button class="flex-1 p-3 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)]" data-type="photo">
                📷 拍照
            </button>
            <button class="flex-1 p-3 rounded-lg bg-[var(--secondary)] text-[var(--secondary-foreground)]" data-type="audio">
                🎤 录音
            </button>
            <button class="flex-1 p-3 rounded-lg bg-[var(--accent)] text-[var(--accent-foreground)]" data-type="text">
                📝 文字
            </button>
        </div>

        <!-- 动态内容区 -->
        <div id="inputContent" class="hidden">
            <!-- 照片拍摄预览 -->
            <div data-type="photo" class="relative camera-preview bg-[var(--muted)] rounded-lg mb-4">
                <video id="cameraPreview" class="w-full rounded-lg" autoplay></video>
                <div class="absolute bottom-4 left-0 right-0 flex justify-center gap-4">
                    <button class="p-2 rounded-full bg-white/20 backdrop-blur-sm" id="toggleCamera">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9h14M7 19l-4-4m0 0l4-4m-4 4h18"/>
                        </svg>
                    </button>
                    <button class="w-12 h-12 rounded-full bg-red-500 border-4 border-white/30" id="shutterButton"></button>
                </div>
            </div>

            <!-- 录音波形区 -->
            <div data-type="audio" class="waveform-panel h-20 bg-[var(--muted)] rounded-lg mb-4"></div>

            <!-- 文字输入区 -->
            <textarea data-type="text" class="w-full p-3 rounded-lg bg-[var(--card)] border border-[var(--border)]"
                      placeholder="记录此刻的想法..."></textarea>

            <div class="flex gap-2 mt-4">
                <button class="flex-1 py-2 bg-[var(--destructive)] text-[var(--destructive-foreground)] rounded-lg" id="cancelBtn">
                    取消
                </button>
                <button class="flex-1 py-2 bg-[var(--primary)] text-[var(--primary-foreground)] rounded-lg" id="confirmBtn">
                    保存
                </button>
            </div>
        </div>
    </div>

    <style>
    .waveform-animation {
        background: linear-gradient(90deg, 
            var(--chart-2) 25%, 
            transparent 25%, 
            transparent 50%, 
            var(--chart-2) 50%, 
            var(--chart-2) 75%,
            transparent 75%
        );
        background-size: 200% 100%;
        animation: wave 1s linear infinite;
    }
    @keyframes wave {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }
</style>
<script>
        // 相机访问
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('cameraPreview');
                video.srcObject = stream;
            } catch (error) {
                console.error('无法访问相机:', error);
            }
        }

        // 音频处理
        let audioContext, analyser;
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new AudioContext();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);

                const canvas = document.createElement('canvas');
                canvas.className = 'w-full h-20';
                document.querySelector('[data-type="audio"]').appendChild(canvas);

                const ctx = canvas.getContext('2d');
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                function draw() {
                    requestAnimationFrame(draw);
                    analyser.getByteTimeDomainData(dataArray);

                    ctx.fillStyle = 'rgba(var(--background-rgb), 0.8)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'rgb(var(--chart-2))';
                    ctx.beginPath();

                    const sliceWidth = canvas.width * 1.0 / bufferLength;
                    let x = 0;

                    for(let i = 0; i < bufferLength; i++) {
                        const v = dataArray[i] / 128.0;
                        const y = v * canvas.height/2;

                        if(i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);

                        x += sliceWidth;
                    }

                    ctx.stroke();
                }

                draw();
            } catch (error) {
                console.error('无法访问麦克风:', error);
            }
        }

        // 输入模式切换
        document.querySelectorAll('[data-type]').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.type;
                document.getElementById('inputSelector').classList.add('hidden');
                document.getElementById('inputContent').classList.remove('hidden');
                document.querySelectorAll('[data-type]').forEach(el => {
                    el.classList.toggle('hidden', el.dataset.type !== type);
                });

                if (type === 'photo') initCamera();
                if (type === 'audio') startRecording();
            });
        });

        // 输入控制逻辑
const inputButtons = document.querySelectorAll('[data-input-type]');
inputButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        const type = btn.dataset.inputType;
        const inputContainer = document.getElementById('inlineInput');
        
        // 隐藏所有输入类型
        inputContainer.querySelectorAll('[data-type]').forEach(el => {
            el.classList.add('hidden');
        });
        
        // 显示当前输入类型
        inputContainer.classList.remove('hidden');
        inputContainer.querySelector(`[data-type="${type}"]`).classList.remove('hidden');

        // 自动聚焦文字输入
        if (type === 'text') {
            inputContainer.querySelector('textarea').focus();
        }
        
        // 启动录音/拍照
        if (type === 'audio') startRecording();
        if (type === 'photo') initCamera();
    });
});

// 保存处理
        document.getElementById('confirmBtn').addEventListener('click', async () => {
            const activeType = document.querySelector('[data-type]:not(.hidden)').dataset.type;
            let content = '';

            switch(activeType) {
                case 'photo':
                    content = '<img src="https://placehold.co/600x400" class="rounded-lg w-full h-48 object-cover">';
                    break;
                case 'audio':
                    content = '<div class="waveform bg-[var(--muted)] h-20 rounded-lg mb-2"></div>';
                    break;
                case 'text':
                    content = document.querySelector('textarea').value;
                    break;
            }

            // 插入时间轴
            const timeline = document.querySelector('.relative.pl-8');
            timeline.insertAdjacentHTML('afterbegin', `
                <div class="timeline-card p-4 mb-4">
                    <div class="flex gap-4">
                        <div class="type-indicator bg-[var(--chart-${activeType === 'photo' ? 1 : activeType === 'audio' ? 2 : 3})]"></div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 text-sm text-[var(--muted-foreground)] mb-2">
                                <span>🕒 ${new Date().toLocaleTimeString()}</span>
                            </div>
                            ${content}
                        </div>
                    </div>
                </div>
            `);

            // 重置输入状态
            document.getElementById('inputSelector').classList.remove('hidden');
            document.getElementById('inputContent').classList.add('hidden');
            document.querySelector('textarea').value = '';
        });

        // 取消按钮
        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('inputSelector').classList.remove('hidden');
            document.getElementById('inputContent').classList.add('hidden');
        });
    </script>
</body>
</html>
