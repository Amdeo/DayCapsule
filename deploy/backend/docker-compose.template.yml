services:
  api:
    image: __BACKEND_IMAGE__
    container_name: daycapsule-api
    restart: unless-stopped
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/daycapsule.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENV: production
      PORT: 3000
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      BASE_URL: ${BASE_URL:-__BASE_URL__}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - daycapsule-network

  nginx:
    image: nginx:alpine
    container_name: daycapsule-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-__PORT__}:80"
    volumes:
      - ./deploy/backend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - daycapsule-network

networks:
  daycapsule-network:
    driver: bridge
