services:
  api:
    image: __BACKEND_IMAGE__
    container_name: daycapsule-api
    restart: unless-stopped
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/daycapsule.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENV: production
      PORT: 3000
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      BASE_URL: ${BASE_URL:-__BASE_URL__}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      shared-proxy:
        aliases:
          - daycapsule-api

networks:
  shared-proxy:
    external: true
    name: ${PROXY_NETWORK:-shared-proxy}
