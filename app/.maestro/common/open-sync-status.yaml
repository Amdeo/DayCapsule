appId: com.memorycapsule.app
---
- runFlow: ../common/open-settings.yaml
- scrollUntilVisible:
    element:
      id: settings-show-sync-status
    direction: UP
    timeout: 10000
- tapOn:
    id: settings-show-sync-status
- extendedWaitUntil:
    visible: "媒体同步状态"
    timeout: 5000
- assertVisible: "媒体同步状态"
- runFlow: ../common/dismiss-dev-warning-toast.yaml
