appId: com.memorycapsule.app
---
- runFlow: ../../common/open-sidebar.yaml
- runFlow:
    when:
      visible:
        id: sidebar-shell
    commands:
      - tapOn:
          id: sidebar-menu-settings
- extendedWaitUntil:
    visible:
      id: settings-page-root
    timeout: 10000
- assertVisible:
    id: settings-page-root
- scrollUntilVisible:
    element:
      text: 账户
    direction: UP
    timeout: 10000
- runFlow:
    when:
      notVisible: "登录 / 注册"
    commands:
      - scrollUntilVisible:
          element:
            text: 退出登录
          direction: DOWN
          timeout: 10000
      - tapOn:
          text: 退出登录
      - tapOn:
          text: 退出
      - assertVisible:
          text: 登录 / 注册
- scrollUntilVisible:
    element:
      text: 登录 / 注册
    direction: DOWN
    timeout: 10000
- tapOn:
    text: 登录 / 注册
- assertVisible:
    id: login-page-root
- tapOn:
    id: detail-page-back-button
- assertVisible:
    id: settings-page-root
