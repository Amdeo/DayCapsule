appId: com.memorycapsule.app
---
- runFlow: ../../common/launch-app.yaml
- runFlow: ../../common/open-e2e-sync-lab.yaml
- tapOn:
    id: e2e-sync-fixture-clear
- tapOn:
    id: e2e-sync-fixture-suspect
- runFlow: ../../common/open-search-overlay.yaml
- inputText: "E2E"
- tapOn:
    id: search-overlay-submit-button
- extendedWaitUntil:
    visible:
      id: entry-card
    timeout: 5000
- tapOn:
    id: entry-card
    index: 0
- extendedWaitUntil:
    visible:
      id: image-viewer-root
    timeout: 5000
- back
- assertVisible:
    id: home-screen-root
