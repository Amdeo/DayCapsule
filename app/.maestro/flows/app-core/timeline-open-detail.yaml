appId: com.memorycapsule.app
---
- runFlow: ../../common/launch-app.yaml
- runFlow: ../../common/open-e2e-sync-lab.yaml
- tapOn:
    id: e2e-sync-fixture-clear
- tapOn:
    id: e2e-sync-fixture-text-detail
- runFlow: ../../common/open-search-overlay.yaml
- inputText: "Text"
- tapOn:
    id: search-overlay-submit-button
- extendedWaitUntil:
    visible:
      id: entry-card
    timeout: 5000
- tapOn:
    id: entry-card
    index: 0
- assertVisible:
    id: text-entry-detail-root
- back
- assertVisible:
    id: home-screen-root
